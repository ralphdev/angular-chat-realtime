<div class="relative">
  <!-- Trigger button -->
  <button
    type="button"
    (click)="fileInput.click()"
    class="p-2 text-slate-400 hover:text-slate-200 transition-colors rounded-lg hover:bg-white/5"
    title="Adjuntar imagen"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M6.75 21h10.5a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0017.25 4.5H6.75A2.25 2.25 0 004.5 6.75v12a2.25 2.25 0 002.25 2.25zm10.5-11.25h.008v.008h-.008V10.5zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
      />
    </svg>
  </button>

  <!-- Hidden input -->
  <input
    #fileInput
    type="file"
    accept="image/png,image/jpeg,image/webp"
    class="hidden"
    (change)="onFileSelected($event)"
  />

  <!-- Preview thumbnail -->
  @if (preview()) {
    <div class="absolute bottom-12 left-0 z-10 animate-slide-up">
      <div class="relative rounded-xl overflow-hidden border border-chat-border shadow-xl">
        <img
          [src]="preview()"
          alt="Preview"
          class="w-32 h-32 object-cover"
        />
        <button
          type="button"
          (click)="clearFile()"
          class="absolute top-1 right-1 w-5 h-5 bg-black/70 rounded-full flex items-center justify-center hover:bg-black/90"
        >
          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <p class="text-xs text-slate-500 mt-1 truncate max-w-[8rem]">{{ fileName() }}</p>
    </div>
  }

  <!-- Error -->
  @if (error()) {
    <div class="absolute bottom-12 left-0 z-10 bg-red-900/80 text-red-200 text-xs px-3 py-2 rounded-lg max-w-48 animate-fade-in">
      {{ error() }}
    </div>
  }
</div>
